<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="Negar capabilities — velocity pen, shapes, RTL text, highlighter, marquee select, zoom and pan, undo and redo, PNG export">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B241D"/>
      <stop offset="50%" stop-color="#12372D"/>
      <stop offset="100%" stop-color="#17402F"/>
    </linearGradient>

    <!-- Card background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2B22"/>
      <stop offset="100%" stop-color="#0A211A"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8EBB5"/>
      <stop offset="100%" stop-color="#8FD6A8"/>
    </linearGradient>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#C8EBB5" opacity="0.08"/>
    </pattern>

    <!-- Ambient glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#548369" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#548369" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Undo icon (reused) -->
    <g id="undoIcon">
      <path d="M3 7v6h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="500" fill="url(#bg)"/>
  <rect width="1280" height="500" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <ellipse cx="180" cy="80" rx="420" ry="260" fill="url(#glow)"/>
  <ellipse cx="1120" cy="440" rx="420" ry="260" fill="url(#glow)" opacity="0.6"/>

  <!-- Corner accent marks -->
  <path d="M 0 0 L 70 0 L 70 2 L 2 2 L 2 70 L 0 70 Z" fill="#C8EBB5" opacity="0.30"/>
  <path d="M 1280 500 L 1210 500 L 1210 498 L 1278 498 L 1278 430 L 1280 430 Z" fill="#C8EBB5" opacity="0.30"/>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <g transform="translate(40 40)">
    <rect x="0" y="-11" width="11" height="11" rx="3" fill="#C8EBB5" opacity="0.9"/>
    <circle cx="5.5" cy="-5.5" r="1.8" fill="#12372D"/>
    <text x="19" y="-2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="11" font-weight="700" letter-spacing="3.2" fill="#8FD6A8" opacity="0.85">CAPABILITIES</text>
  </g>

  <text x="40" y="88" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="30" font-weight="800" letter-spacing="-0.6" fill="#F4FBF2">Everything a sketch needs</text>

  <text x="1240" y="88" text-anchor="end" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif"
        font-size="18" font-weight="500" fill="#C8EBB5" opacity="0.55">و هیچ‌چیز اضافه</text>

  <!-- ═══════════════ CARD 1 — VELOCITY PEN ═══════════════ -->
  <g transform="translate(34 128)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Motion-blur ghost strokes -->
    <path d="M 24 58 C 58 24, 92 78, 128 48 C 164 22, 198 72, 236 46"
          fill="none" stroke="#8FD6A8" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <path d="M 24 66 C 58 32, 92 86, 128 56 C 164 30, 198 80, 236 54"
          fill="none" stroke="#8FD6A8" stroke-width="2" stroke-linecap="round" opacity="0.18"/>
    <!-- Main stroke -->
    <path d="M 24 62 C 58 28, 92 82, 128 52 C 164 26, 198 76, 236 50"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Velocity pen</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">ضخامت واکنشی به سرعت دست</text>
  </g>

  <!-- ═══════════════ CARD 2 — SHAPES & ARROWS ═══════════════ -->
  <g transform="translate(342 128)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Rectangle -->
    <rect x="28" y="44" width="38" height="30" rx="6" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <!-- Circle -->
    <circle cx="100" cy="59" r="16" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <!-- Diamond -->
    <g transform="translate(152 59)">
      <polygon points="0,-16 16,0 0,16 -16,0" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Star -->
    <g transform="translate(206 59)">
      <polygon points="0,-16 4.5,-5 16,-5 6.5,3 10,15 0,7 -10,15 -6.5,3 -16,-5 -4.5,-5"
               fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <!-- Arrow -->
    <g transform="translate(234 44)">
      <line x1="0" y1="30" x2="28" y2="0" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      <polyline points="20,0 28,0 28,8" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Shapes &amp; arrows</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">اشکال، خط و فلش</text>
  </g>

  <!-- ═══════════════ CARD 3 — RTL TEXT ═══════════════ -->
  <g transform="translate(650 128)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Persian word -->
    <text x="258" y="62" text-anchor="end" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif"
          font-size="30" font-weight="600" fill="url(#accent)">نگار</text>
    <!-- Typing cursor -->
    <line x1="216" y1="38" x2="216" y2="68" stroke="#C8EBB5" stroke-width="2" opacity="0.9"/>

    <!-- Faint continuation lines -->
    <line x1="180" y1="80" x2="258" y2="80" stroke="#C8EBB5" stroke-width="1.6" opacity="0.35" stroke-linecap="round"/>
    <line x1="204" y1="92" x2="258" y2="92" stroke="#C8EBB5" stroke-width="1.6" opacity="0.22" stroke-linecap="round"/>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">RTL text</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">متن فارسی، قابل ویرایش</text>
  </g>

  <!-- ═══════════════ CARD 4 — HIGHLIGHTER ═══════════════ -->
  <g transform="translate(958 128)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Text lines (behind) -->
    <line x1="24" y1="52" x2="240" y2="52" stroke="#C8EBB5" stroke-width="3" opacity="0.16" stroke-linecap="round"/>
    <line x1="24" y1="70" x2="200" y2="70" stroke="#C8EBB5" stroke-width="3" opacity="0.16" stroke-linecap="round"/>
    <line x1="24" y1="88" x2="252" y2="88" stroke="#C8EBB5" stroke-width="3" opacity="0.16" stroke-linecap="round"/>

    <!-- Highlighter band over line 2 -->
    <rect x="18" y="60" width="192" height="20" rx="4" fill="#F2E27A" opacity="0.45"/>
    <rect x="18" y="60" width="192" height="20" rx="4" fill="#F2E27A" opacity="0.18"/>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Highlighter</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">ماژیک شفاف، خوانا</text>
  </g>

  <!-- ═══════════════ CARD 5 — MARQUEE SELECT ═══════════════ -->
  <g transform="translate(34 300)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Ghost shapes inside -->
    <circle cx="110" cy="62" r="13" fill="none" stroke="#C8EBB5" stroke-width="1.5" opacity="0.35"/>
    <rect x="140" y="48" width="30" height="28" rx="5" fill="none" stroke="#C8EBB5" stroke-width="1.5" opacity="0.35"/>

    <!-- Marquee selection -->
    <rect x="72" y="32" width="140" height="62" rx="4"
          fill="#C8EBB5" fill-opacity="0.06"
          stroke="#C8EBB5" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Corner handles -->
    <circle cx="72" cy="32" r="4" fill="#0E2B22" stroke="#C8EBB5" stroke-width="1.5"/>
    <circle cx="212" cy="32" r="4" fill="#0E2B22" stroke="#C8EBB5" stroke-width="1.5"/>
    <circle cx="212" cy="94" r="4" fill="#0E2B22" stroke="#C8EBB5" stroke-width="1.5"/>
    <circle cx="72" cy="94" r="4" fill="#0E2B22" stroke="#C8EBB5" stroke-width="1.5"/>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Marquee select</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">انتخاب، جابجایی، تغییر اندازه</text>
  </g>

  <!-- ═══════════════ CARD 6 — ZOOM & PAN ═══════════════ -->
  <g transform="translate(342 300)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Magnifier -->
    <g transform="translate(90 60)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
      <line x1="14" y1="14" x2="30" y2="30" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Zoom badge -->
    <g transform="translate(170 38)">
      <rect x="0" y="0" width="82" height="26" rx="13"
            fill="#C8EBB5" fill-opacity="0.10" stroke="#C8EBB5" stroke-opacity="0.35"/>
      <text x="41" y="17" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace"
            font-size="12" font-weight="700" fill="#C8EBB5">150%</text>
    </g>

    <!-- Small pan hint -->
    <g transform="translate(176 76)" opacity="0.55">
      <circle cx="0" cy="0" r="1.6" fill="#C8EBB5"/>
      <circle cx="10" cy="0" r="1.6" fill="#C8EBB5"/>
      <circle cx="-10" cy="0" r="1.6" fill="#C8EBB5"/>
      <circle cx="0" cy="-10" r="1.6" fill="#C8EBB5"/>
      <circle cx="0" cy="10" r="1.6" fill="#C8EBB5"/>
    </g>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Zoom &amp; pan</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">Ctrl + اسکرول، Space برای جابجایی</text>
  </g>

  <!-- ═══════════════ CARD 7 — UNDO / REDO ═══════════════ -->
  <g transform="translate(650 300)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Undo icon -->
    <g transform="translate(78 40) scale(2.6)" color="#C8EBB5">
      <use href="#undoIcon"/>
    </g>

    <!-- Redo icon (mirrored, faded) -->
    <g transform="translate(158 40) scale(-2.6, 2.6)" color="#8FD6A8" opacity="0.45">
      <use href="#undoIcon"/>
    </g>

    <!-- History dots -->
    <g transform="translate(120 96)" fill="#C8EBB5">
      <circle cx="-20" cy="0" r="2.5" opacity="0.35"/>
      <circle cx="-8" cy="0" r="2.5" opacity="0.55"/>
      <circle cx="4" cy="0" r="3" opacity="0.95"/>
      <circle cx="16" cy="0" r="2.5" opacity="0.55"/>
      <circle cx="28" cy="0" r="2.5" opacity="0.35"/>
    </g>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">Undo / redo</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">تاریخچهٔ دقیق، ۶۰ مرحله</text>
  </g>

  <!-- ═══════════════ CARD 8 — PNG EXPORT ═══════════════ -->
  <g transform="translate(958 300)">
    <rect width="288" height="156" rx="14" fill="url(#cardBg)" stroke="#548369" stroke-opacity="0.30"/>
    <rect width="288" height="156" rx="14" fill="url(#dots)" opacity="0.5"/>

    <!-- Image frame -->
    <rect x="60" y="28" width="72" height="56" rx="6"
          fill="none" stroke="#C8EBB5" stroke-width="1.8"
          stroke-dasharray="4 3" opacity="0.7"/>
    <!-- Mountain -->
    <path d="M 70 74 L 86 56 L 98 68 L 112 50 L 124 74 Z"
          fill="none" stroke="#C8EBB5" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
    <!-- Sun -->
    <circle cx="82" cy="43" r="3" fill="none" stroke="#C8EBB5" stroke-width="1.3" opacity="0.6"/>

    <!-- Download arrow -->
    <g transform="translate(172 40)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="-7,15 0,23 7,15"
                fill="none" stroke="url(#accent)" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -14 28 L -14 32 L 14 32 L 14 28"
            fill="none" stroke="url(#accent)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="20" y="112" font-family="Inter, system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="700" fill="#F4FBF2">PNG export</text>
    <text x="20" y="134" font-family="Vazirmatn, Tahoma, sans-serif"
          font-size="11" fill="#C8EBB5" opacity="0.60">خروجی با کیفیت نمایشگر</text>
  </g>

  <!-- Vignette overlay -->
  <rect width="1280" height="500" fill="url(#vignette)" pointer-events="none"/>
</svg>