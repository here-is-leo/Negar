<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Negar — Minimal RTL canvas drawing app">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B241D"/>
      <stop offset="55%" stop-color="#12372D"/>
      <stop offset="100%" stop-color="#1B4A3B"/>
    </linearGradient>

    <!-- Accent gradient for stroke -->
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8EBB5"/>
      <stop offset="50%" stop-color="#8FD6A8"/>
      <stop offset="100%" stop-color="#548369"/>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#548369" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#548369" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#C8EBB5" opacity="0.10"/>
    </pattern>

    <!-- Clip for content -->
    <clipPath id="clipAll">
      <rect width="1280" height="320" rx="0"/>
    </clipPath>

    <!-- Filter: soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clipAll)">
    <!-- Background -->
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>

    <!-- Ambient glows -->
    <ellipse cx="180" cy="60" rx="360" ry="220" fill="url(#glow)"/>
    <ellipse cx="1120" cy="280" rx="380" ry="240" fill="url(#glow)" opacity="0.7"/>

    <!-- Decorative corner accents -->
    <path d="M 0 0 L 90 0 L 90 2 L 2 2 L 2 90 L 0 90 Z" fill="#C8EBB5" opacity="0.35"/>
    <path d="M 1280 320 L 1190 320 L 1190 318 L 1278 318 L 1278 230 L 1280 230 Z" fill="#C8EBB5" opacity="0.35"/>

    <!-- ═══ Visual: freehand sketch on the right ═══ -->
    <g transform="translate(760 40)" opacity="0.95">
      <!-- Faint grid card -->
      <rect x="0" y="0" width="480" height="240" rx="18" fill="#0E2B22" opacity="0.7" stroke="#548369" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="480" height="240" rx="18" fill="url(#dots)" opacity="0.6"/>

      <!-- A wavy freehand stroke with variable width -->
      <path d="M 40 170
               C 70 140, 90 190, 120 150
               C 150 110, 175 175, 205 140
               C 235 105, 260 170, 290 135
               C 320 100, 345 165, 375 130
               C 400 105, 420 145, 440 120"
            fill="none" stroke="url(#strokeGrad)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>

      <!-- Star shape -->
      <g transform="translate(80 60)">
        <polygon points="0,-22 6,-7 22,-7 9,3 14,19 0,9 -14,19 -9,3 -22,-7 -6,-7"
                 fill="none" stroke="#C8EBB5" stroke-width="2.2" stroke-linejoin="round" opacity="0.9"/>
      </g>

      <!-- Circle / ellipse -->
      <ellipse cx="180" cy="60" rx="30" ry="20"
               fill="none" stroke="#8FD6A8" stroke-width="2.2" opacity="0.9"/>

      <!-- Rounded rect -->
      <rect x="250" y="30" width="70" height="46" rx="10"
            fill="none" stroke="#C8EBB5" stroke-width="2.2" opacity="0.85"/>

      <!-- Arrow -->
      <g transform="translate(360 40)" opacity="0.95">
        <line x1="0" y1="30" x2="60" y2="0" stroke="#C8EBB5" stroke-width="2.2" stroke-linecap="round"/>
        <polyline points="50,0 60,0 60,10" fill="none" stroke="#C8EBB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Text placeholder dashes (RTL style) -->
      <g opacity="0.7">
        <line x1="330" y1="70" x2="440" y2="70" stroke="#C8EBB5" stroke-width="2" stroke-linecap="round"/>
        <line x1="360" y1="84" x2="440" y2="84" stroke="#C8EBB5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="390" y1="98" x2="440" y2="98" stroke="#C8EBB5" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </g>

      <!-- Small dot cluster -->
      <g fill="#C8EBB5" opacity="0.55">
        <circle cx="60" cy="120" r="2"/>
        <circle cx="74" cy="120" r="2"/>
        <circle cx="88" cy="120" r="2"/>
      </g>

      <!-- Cursor marker -->
      <g transform="translate(438 118)" opacity="0.9">
        <path d="M 0 0 L 10 26 L 14 16 L 24 14 Z" fill="#C8EBB5" stroke="#12372D" stroke-width="1"/>
      </g>
    </g>

    <!-- ═══ Left side: wordmark + tagline ═══ -->

    <!-- Small eyebrow label -->
    <g transform="translate(72 78)">
      <rect x="0" y="-14" width="14" height="14" rx="4" fill="#C8EBB5" opacity="0.9"/>
      <circle cx="7" cy="-7" r="2.2" fill="#12372D"/>
      <text x="24" y="-3" font-family="Vazirmatn, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13" font-weight="600" letter-spacing="4" fill="#8FD6A8" fill-opacity="0.85">CANVAS DRAWING APP</text>
    </g>

    <!-- Main wordmark: Negar -->
    <text x="72" y="152"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="86" font-weight="800" letter-spacing="-3"
          fill="#F4FBF2">Negar</text>

    <!-- Persian wordmark: نگار -->
    <text x="72" y="220"
          font-family="Vazirmatn, 'Noto Naskh Arabic', Tahoma, sans-serif"
          font-size="46" font-weight="600" letter-spacing="-1"
          fill="#C8EBB5" opacity="0.95">نگار</text>

    <!-- Divider -->
    <line x1="72" y1="240" x2="360" y2="240" stroke="#548369" stroke-width="1.5" opacity="0.7"/>

    <!-- Tagline -->
    <text x="72" y="266"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="15" font-weight="500" letter-spacing="0.2"
          fill="#C8EBB5" fill-opacity="0.72">Sketch freely. Stay minimal.</text>

    <!-- Bottom-left meta chips -->
    <g transform="translate(72 285)" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="600">
      <g transform="translate(0 0)">
        <rect x="0" y="-10" width="78" height="20" rx="10" fill="#C8EBB5" fill-opacity="0.10" stroke="#C8EBB5" stroke-opacity="0.30"/>
        <circle cx="10" cy="0" r="2.5" fill="#C8EBB5"/>
        <text x="20" y="4" fill="#C8EBB5" fill-opacity="0.9">VANILLA JS</text>
      </g>
      <g transform="translate(88 0)">
        <rect x="0" y="-10" width="66" height="20" rx="10" fill="#C8EBB5" fill-opacity="0.10" stroke="#C8EBB5" stroke-opacity="0.30"/>
        <circle cx="10" cy="0" r="2.5" fill="#C8EBB5"/>
        <text x="20" y="4" fill="#C8EBB5" fill-opacity="0.9">0 DEPS</text>
      </g>
      <g transform="translate(164 0)">
        <rect x="0" y="-10" width="56" height="20" rx="10" fill="#C8EBB5" fill-opacity="0.10" stroke="#C8EBB5" stroke-opacity="0.30"/>
        <circle cx="10" cy="0" r="2.5" fill="#C8EBB5"/>
        <text x="20" y="4" fill="#C8EBB5" fill-opacity="0.9">RTL</text>
      </g>
    </g>

    <!-- Vignette overlay -->
    <rect width="1280" height="320" fill="url(#vignette)"/>
  </g>
</svg>